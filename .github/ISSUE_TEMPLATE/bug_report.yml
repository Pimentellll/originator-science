name: Bug report
description: Something in the app, API, simulator or evaluator does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, URL/route, scenario, policy and seed if relevant.
      placeholder: |
        ./mirage demo --scenario ASSAY_FAILURE --seed 4 --policy greedy_eig
        then ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `./mirage doctor` and the git SHA (`git rev-parse --short HEAD`).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not a security issue (those go through SECURITY.md, not public issues).
          required: true
        - label: I removed any API keys or secrets from the text above.
          required: true
