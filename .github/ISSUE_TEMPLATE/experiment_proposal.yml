name: Experiment proposal
description: Propose a new experiment, model, method or analysis to run on the benchmark.
labels: [experiment]
body:
  - type: textarea
    id: question
    attributes:
      label: Question and hypothesis
      description: What do you want to find out, and what result would change your mind?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design
      description: Configurations, seeds/matrix, and what stays fixed (prompt, tools, scorer).
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics and decision rule
      description: Which metrics (e.g. M1–M4, Q1, Brier), and the rule you will apply before seeing results.
  - type: input
    id: cost
    attributes:
      label: Expected cost
      description: API spend or compute, and the cap you propose.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The experiment does not modify frozen results or existing scorers (a scorer change is a separate proposal).
          required: true
        - label: It will be registered in writing before any scored run.
          required: true
