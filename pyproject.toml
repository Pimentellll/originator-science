[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "0.1.0"
description = "MIRAGE-Bio: controlled virtual microbiology lab benchmark for measurement-artefact diagnosis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "matplotlib==3.10.8",
    "pydantic==2.12.5",
    "anthropic==1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mirage.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
