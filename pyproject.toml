[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "0.1.0"
description = "MIRAGE: synthetic benchmark and decision architecture for diagnosing and rescuing failed de novo miniprotein binder campaigns (includes the legacy MIRAGE-Bio growth benchmark)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "matplotlib==3.10.8",
    "pydantic==2.12.5",
    "anthropic==1.10.0",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]
rl = [
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mirage.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
